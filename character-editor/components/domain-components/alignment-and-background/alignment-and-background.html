
<section id="domain-alignment-and-background-component">
    <link rel="stylesheet" href="./components/domain-components/alignment-and-background/alignment-and-background.css" />
    <div id="alignment-and-background-content">
        <div id="alignment-row" kit-element>
            <kit kit-component="./components/shared/selection/selection.html"
                 kit-obj-selection-model="selectionModel:#model.getAlignmentSelectionModel()">
            </kit>
        </div>
        <div id="background-row" kit-element>
            <kit kit-component="./components/shared/selection/selection.html"
                 kit-obj-selection-model="selectionModel:#model.getBackgroundSelectionModel()">
            </kit>
        </div>
        <div id="traits-row" kit-if="#model.hasBackground()">
            <kit kit-component="./components/shared/selection/selection.html"
                 kit-obj-selection-model="selectionModel:#model.getTraitsSelectionModel()">
            </kit>
        </div>
        <div id="ideal-row" kit-if="#model.hasBackground()">
            <kit kit-component="./components/shared/selection/selection.html"
                 kit-obj-selection-model="selectionModel:#model.getIdealSelectionModel()">
            </kit>
        </div>
        <div id="bond-row" kit-if="#model.hasBackground()">
            <kit kit-component="./components/shared/selection/selection.html"
                 kit-obj-selection-model="selectionModel:#model.getBondSelectionModel()">
            </kit>
        </div>
        <div id="flaw-row" kit-if="#model.hasBackground()">
            <kit kit-component="./components/shared/selection/selection.html"
                 kit-obj-selection-model="selectionModel:#model.getFlawSelectionModel()">
            </kit>
        </div>
        <div id="background-selections-row" kit-if="#model.hasBackgroundSelections()">
            <div kit-array="#model.getBackgroundSelections()"
                 kit-array-item-alias="selection">
                <div class="selection-control">
                    <kit kit-component="./components/shared/selection/selection.html"
                         kit-obj-selection-model="selectionModel:#selection">
                    </kit>
                </div>
            </div>
        </div>
    </div>
</section>
